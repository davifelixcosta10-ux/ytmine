[project]
name = "ytmine"
version = "0.1.0"
description = "Baixa do YouTube somente o que e seu (seu canal) ou o que esta sob licenca Creative Commons."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.7",
    "httpx2[http2,brotli,zstd]>=0.4",
    "pydantic>=2.10",
    "rich>=13.9",
    "typer>=0.15",
]

[project.scripts]
ytmine = "ytmine.cli:main"

[dependency-groups]
dev = [
    "basedpyright>=1.21",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ytmine"]

# ─────────────────────────────────────────────────────────────────
# basedpyright — typeCheckingMode = "all"
# ─────────────────────────────────────────────────────────────────
[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.13"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]
reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"
# The `case unreachable: assert_never(x)` guard is dead by proof — basedpyright
# already sees the match is exhaustive — not by accident. It is the guard that
# makes adding a variant a type error instead of a silent fallthrough.
reportUnnecessaryComparison = "none"

# ─────────────────────────────────────────────────────────────────
# ruff — select = ["ALL"]
# ─────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "ISC001",
    "D203",
    "D213",
    "CPY001",
    "FBT001",
    "FBT002",
    "TD002",
    "TD003",
    "FIX002",
    # Project overrides — each is a documented policy decision, not a blanket off.
    "N815",   # the YouTube API is camelCase; payload models must mirror the wire
    "D105",   # __str__ on a typed error is self-describing
    "D107",   # small wrappers whose __init__ only stores injected deps
    "TC001",  # no import cycles in a CLI; TYPE_CHECKING blocks add noise
    "TC002",
    "TC003",
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",
    "ARG",
    "PLR2004",
    "SLF001",
    "D",
    "N801",   # Test_<Behavior> reads better than TestBehavior
    "S108",   # test paths
    "S106",   # client_secret is a field name from Google's schema
]
"src/ytmine/models.py" = [
    "D101",   # payload classes: the field names are the schema
]
"scripts/**/*.py" = [
    "T201",
    "INP001",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "typer.Argument",
    "typer.Option",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

# ─────────────────────────────────────────────────────────────────
# pytest
# ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
